<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6C4AB6">
  <meta name="description" content="Game interaktif IPS untuk anak: kuis topik, dunia, negara, tebak bendera, misi harian, progres, dan bintang.">
  <meta name="application-name" content="IPS Ceria">
  <meta name="apple-mobile-web-app-title" content="IPS Ceria">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>IPS Ceria</title>

  <!-- Ikon Tabler -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <!-- Font ramah anak -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="app.css">
  <!-- Embedded inside the Mora app (iframe) — no PWA install/manifest here, Mora is the app shell. -->
</head>
<body>
  <h1 class="sr-only">Petualangan IPS Ceria — game IPS interaktif untuk anak dengan bintang dan lencana.</h1>
  <div id="app"></div>

  <!-- Generator QR untuk join room (opsional; app tetap jalan tanpa ini) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="brand.js"></script>
  <script>
  /* Mora bridge: pre-seed the child's name from the Mora family profile
     (passed via ?name=) so the game's own name-entry step is skipped, and
     mark <body> so the "Ganti nama"/"Ganti pemain" affordances can be
     neutralized — Mora's own profile switcher is the single source of
     truth for who's playing. */
  (function () {
    var params = new URLSearchParams(location.search);
    var moraName = params.get('name');
    if (moraName) {
      try {
        Store.set(K.player, moraName);
      } catch (e) {}
      document.body.classList.add('mora-embed');
    }
  })();
  </script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
